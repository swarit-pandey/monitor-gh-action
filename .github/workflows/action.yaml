name: Go CI/CD
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Run AccuKnox CI/CD Scan
      uses: accuknox/report-action@v0.3.15
      with:
        knoxctl_version: '0.6.4'
        kubearmor_version: '1.3.8'

    - name: Build
      run: go build -v ./...

    - name: Setup Py
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Run TCP
      run: python ./tcp.py 12345

    - name: Run violation script
      run: |
        chmod +x ./violate.sh
        sudo ./violate.sh
