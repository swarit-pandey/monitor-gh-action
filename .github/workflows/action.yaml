name: Go CI/CD
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: List contents before scan
      run: |
        echo "Current directory:"
        pwd
        echo "Contents of current directory:"
        ls -R
        echo "Contents of GITHUB_WORKSPACE:"
        ls -R $GITHUB_WORKSPACE

    - name: Run AccuKnox CI/CD Scan
      uses: accuknox/report-action@v0.3.3
      with:
        knoxctl_version: '0.6.1'

    - name: List contents after scan
      run: |
        echo "Current directory:"
        pwd
        echo "Contents of current directory:"
        ls -R
        echo "Contents of GITHUB_WORKSPACE:"
        ls -R $GITHUB_WORKSPACE
        echo "Contents of knoxctl-results directory (if exists):"
        ls -R $GITHUB_WORKSPACE/knoxctl-results || echo "knoxctl-results directory not found"

    - name: Build
      run: go build -v ./...
